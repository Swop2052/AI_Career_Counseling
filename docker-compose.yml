version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillsense_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - DATABASE_TYPE=sqlite
      - DB_PATH=/app/data/career_guide.db
    volumes:
      - ./data:/app/data
