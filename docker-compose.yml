version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillsense_backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - DATABASE_TYPE=sqlite
      - DB_PATH=/app/data/career_guide.db
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
