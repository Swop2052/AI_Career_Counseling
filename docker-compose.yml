version: '3.8'

services:
  skillsense_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillsense_backend
    restart: always
    ports:
      - "127.0.0.1:8079:5000"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    networks:
      - shared_backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  shared_backend:
    external: true
