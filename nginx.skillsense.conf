# SkillSense - Nginx VPS Configuration
# File: /etc/nginx/sites-available/skillsense
# Production-ready with SEO + Security headers

server {
    listen 80;
    listen [::]:80;
    server_name skillsense.aisense.co.in;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name skillsense.aisense.co.in;

    # ─── SSL ───────────────────────────────────────────
    # Paths from Certbot / Let's Encrypt (adjust if using different CA)
    ssl_certificate     /etc/letsencrypt/live/skillsense.aisense.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skillsense.aisense.co.in/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/skillsense.aisense.co.in/chain.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ─── SECURITY HEADERS ─────────────────────────────
    # Prevents clickjacking (embedding in iframes)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevents MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # XSS protection for older browsers
    add_header X-XSS-Protection "1; mode=block" always;

    # HTTPS enforced for 1 year (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions policy: restrict sensitive APIs
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self), usb=()" always;

    # Content Security Policy
    # Allows: self, Google Fonts, GA4, Razorpay, Anthropic CDN
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval'
            https://www.googletagmanager.com
            https://www.google-analytics.com
            https://checkout.razorpay.com;
        style-src 'self' 'unsafe-inline'
            https://fonts.googleapis.com;
        font-src 'self'
            https://fonts.gstatic.com;
        img-src 'self' data: blob:
            https://www.google-analytics.com
            https://www.googletagmanager.com;
        connect-src 'self'
            https://www.google-analytics.com
            https://analytics.google.com
            https://api.razorpay.com
            https://lumberjack.razorpay.com
            https://api.anthropic.com;
        frame-src
            https://api.razorpay.com;
        object-src 'none';
        base-uri 'self';
        form-action 'self';
        upgrade-insecure-requests;
    " always;

    # ─── FRONTEND (React SPA) ─────────────────────────
    root /var/www/skillsense/frontend/dist;
    index index.html;

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot|mp4)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SEO files: never cache robots.txt and sitemap.xml
    location = /robots.txt {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }
    location = /sitemap.xml {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # SPA fallback: all non-file routes return index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # ─── BACKEND API (Flask on port 5000) ─────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Security: hide backend server info
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    120s;

        # Rate limiting placeholder (define zone above this block)
        # limit_req zone=api_limit burst=20 nodelay;
    }

    # ─── BLOCK SENSITIVE PATHS ─────────────────────────
    # Block access to hidden files (e.g., .env, .git)
    location ~ /\. {
        deny all;
        access_log off;
    }

    # ─── LOGGING ──────────────────────────────────────
    access_log /var/log/nginx/skillsense_access.log;
    error_log  /var/log/nginx/skillsense_error.log;
}
